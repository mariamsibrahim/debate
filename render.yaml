# Render Blueprint — see DEPLOY.md for the click-by-click walkthrough.
# This provisions the Postgres database and the API's web service together;
# the two required secrets (WEB_ORIGIN, ANTHROPIC_API_KEY) are intentionally
# left for you to set in the Render dashboard rather than committed here.

databases:
  - name: debate-postgres
    plan: free
    databaseName: debate
    user: debate

services:
  - type: web
    name: debate-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    # No custom health check path: the free-tier cold start (Prisma migrate
    # + Nest bootstrap) was slower than a DB-backed health check's timeout
    # allowed, so this falls back to Render's default open-port check.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: debate-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MODERATOR_MODEL
        value: claude-haiku-4-5-20251001
      - key: JUDGE_MODEL
        value: claude-sonnet-5
      - key: GEMINI_MODEL
        value: gemini-2.0-flash-lite
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      # Set these four in the Render dashboard after first deploy:
      - key: WEB_ORIGIN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
